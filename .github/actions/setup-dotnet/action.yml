name: Setup .NET
description: Configure the repository SDK and cache locked NuGet packages.

runs:
  using: composite
  steps:
    - name: '⚙️ Configure .NET environment'
      shell: bash
      run: |
        set -euo pipefail
        echo "NUGET_PACKAGES=${GITHUB_WORKSPACE}/.nuget/packages" >> "$GITHUB_ENV"
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
        echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"

    - name: '🔧 Setup .NET'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: apps/api/global.json
        cache: true
        cache-dependency-path: apps/api/**/packages.lock.json
