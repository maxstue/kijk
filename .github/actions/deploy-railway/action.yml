name: Deploy to Railway
description: Deploy the checked-out repository to a specific Railway service.

inputs:
  api_token:
    description: Railway API token authorized to deploy the service.
    required: true
  project_id:
    description: Railway project ID.
    required: true
  service_id:
    description: Railway service ID.
    required: true
  environment_id:
    description: Railway environment ID.
    required: true
  release_summary:
    description: Audit message attached to the Railway deployment.
    required: true
  release_version:
    description: Version embedded into the deployed client and API artifacts.
    required: true
  source_sha:
    description: Commit SHA embedded into the deployed client and API artifacts.
    required: true

runs:
  using: composite
  steps:
    - name: '🏷️ Embed release metadata'
      shell: sh
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -eu

        case "$RELEASE_VERSION" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "Invalid release version: $RELEASE_VERSION" >&2; exit 1 ;;
        esac

        case "$SOURCE_SHA" in
          *[!0-9a-f]*|'') echo "Invalid source SHA" >&2; exit 1 ;;
        esac

        sed -i "s|\"commit\": \"[^\"]*\"|\"commit\": \"$SOURCE_SHA\"|" apps/client/src/release-metadata.json
        sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$RELEASE_VERSION\"|" apps/client/src/release-metadata.json
        sed -i "s|<KijkCommitSha>[^<]*</KijkCommitSha>|<KijkCommitSha>$SOURCE_SHA</KijkCommitSha>|" apps/api/Directory.Build.Release.props
        sed -i "s|<Version>[^<]*</Version>|<Version>$RELEASE_VERSION</Version>|" apps/api/Directory.Build.Release.props

    - name: '🚀 Deploy service'
      shell: sh
      env:
        RAILWAY_API_TOKEN: ${{ inputs.api_token }}
        RAILWAY_PROJECT_ID: ${{ inputs.project_id }}
        RAILWAY_SERVICE_ID: ${{ inputs.service_id }}
        RAILWAY_ENVIRONMENT_ID: ${{ inputs.environment_id }}
        RAILWAY_RELEASE_SUMMARY: ${{ inputs.release_summary }}
      run: |
        set -eu
        railway up \
          --project "$RAILWAY_PROJECT_ID" \
          --service "$RAILWAY_SERVICE_ID" \
          --environment "$RAILWAY_ENVIRONMENT_ID" \
          --ci \
          -m "$RAILWAY_RELEASE_SUMMARY"
