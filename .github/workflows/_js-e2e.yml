name: JavaScript E2E tests

# Runs the Playwright E2E tests of the client against the Vite dev server with a mocked API.
# The calling job must grant `id-token: write` for the Infisical OIDC login.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: "🎭 Client E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The ci environment binds the shared CI identity in Infisical (OIDC subject), which may only read
    # dev /CI/E2e and prod /CI/Sonar.
    # deployment: false uses the environment for its variables and OIDC subject without creating a deployment entry.
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js
        with:
          playwright: true

      - name: "🔐 Load Clerk dev secrets"
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: https://eu.infisical.com
          env-slug: dev
          secret-path: /CI/E2e

      - name: "🎭 E2E tests"
        working-directory: apps/client
        run: pnpm exec playwright test

      - name: "📎 Upload Playwright results"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: apps/client/test-results
          retention-days: 7
