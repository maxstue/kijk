name: Changes

# Decides which parts of the repository a run has to check. Pull requests only check the parts they touch; pushes and
# manual runs check everything, so the main branch always has complete results (and complete Sonar coverage).
#
# JavaScript is decided per workspace: `js-workspaces` lists the directories of the workspaces a pull request changes
# plus every workspace that depends on them (pnpm's `...[ref]` filter), e.g. a change in `packages/core` also checks
# `packages/ui` and `apps/client`. Changes to shared files (root manifests, lockfile, JavaScript CI) check all of them.
# New workspaces are picked up automatically. Add a filter here when a new area gets its own building block.

on:
  workflow_call:
    outputs:
      js:
        description: Whether any JavaScript workspace has to be checked.
        value: ${{ jobs.changes.outputs.js }}
      js-workspaces:
        description: JSON array of the JavaScript workspace directories to check, e.g. ["apps/client","packages/ui"].
        value: ${{ jobs.changes.outputs.js-workspaces }}
      dotnet:
        description: Whether the .NET API has to be checked.
        value: ${{ jobs.changes.outputs.dotnet }}

permissions:
  contents: read

jobs:
  changes:
    name: "🧭 Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js == 'true' }}
      js-workspaces: ${{ steps.workspaces.outputs.list || '[]' }}
      dotnet: ${{ github.event_name != 'pull_request' || steps.filter.outputs.dotnet == 'true' }}

    steps:
      # A pull request checks out its merge commit; its first parent is the base branch, so `HEAD^1` compares exactly
      # the changes of the pull request.
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: "🧭 Filter changed paths"
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
              - ".github/workflows/_changes.yml"
            js-shared: &js-shared
              - *ci
              - ".github/actions/setup-js/**"
              - ".github/workflows/_js-*.yml"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            js:
              - *js-shared
              - "apps/client/**"
              - "packages/**"
            dotnet:
              - *ci
              - ".github/actions/setup-dotnet/**"
              - ".github/workflows/_dotnet.yml"
              - "apps/api/**"

      # Only provides pnpm to read the workspace graph; nothing is installed.
      - name: "🔧 Set up Vite+"
        if: github.event_name != 'pull_request' || steps.filter.outputs.js == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "26.12.1"
          cache: false
          run-install: false

      - name: "🧭 Select JavaScript workspaces"
        id: workspaces
        if: github.event_name != 'pull_request' || steps.filter.outputs.js == 'true'
        env:
          ALL: ${{ github.event_name != 'pull_request' || steps.filter.outputs.js-shared == 'true' }}
        run: |
          if [ "$ALL" = "true" ]; then selection=(--recursive); else selection=(--filter '...[HEAD^1]'); fi
          list="$(vp env exec pnpm "${selection[@]}" ls --depth -1 --json \
            | jq -c --arg root "$(pwd -P)/" '[.[].path | ltrimstr($root) | select(startswith("apps/") or startswith("packages/"))]')"
          echo "JavaScript workspaces to check: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
