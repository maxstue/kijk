name: JavaScript tests

# Runs the Vitest suite of every tested workspace in its own parallel job and uploads its LCOV report as
# `coverage-js-<workspace>`, which `_sonar.yml` picks up automatically. To test a new workspace, give it a
# `test:coverage` script and add it to the matrix; `browser: true` installs Chromium for Vitest browser tests.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: "🧪 ${{ matrix.workspace }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: client
            directory: apps/client
            browser: true
          - workspace: api
            directory: packages/api
            browser: false
          - workspace: core
            directory: packages/core
            browser: false
          - workspace: ui
            directory: packages/ui
            browser: true

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js
        with:
          playwright: ${{ matrix.browser }}

      - name: "📊 Tests and coverage"
        working-directory: ${{ matrix.directory }}
        run: pnpm test:coverage

      - name: "📎 Upload coverage"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js-${{ matrix.workspace }}
          path: ${{ matrix.directory }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
