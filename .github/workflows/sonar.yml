name: SonarQube Cloud 🔎

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "🔎 Analyze repository"
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: 🏖️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      - name: 🔧 Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 🔧 Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: 📦 Install JavaScript dependencies
        run: pnpm ci

      - name: 🎭 Install Playwright browser
        run: pnpm --filter kijk-client exec playwright install --with-deps chromium

      - name: 📦 Restore .NET dependencies
        run: dotnet restore apps/api/Kijk.slnx

      - name: 📦 Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: 🔎 Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"maxstue_kijk" \
            /o:"maxstue" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="apps/api/TestResults/*.coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="apps/client/coverage/lcov.info" \
            /d:sonar.plsql.file.suffixes="tab,pkb" \
            /d:sonar.postgres.file.suffixes="sql,pgsql,psql"

      - name: 🧱 Build
        run: |
          dotnet build apps/api/Kijk.slnx --configuration Release --no-restore
          pnpm build:client

      - name: 🧹 Format
        run: |
          dotnet format apps/api/Kijk.slnx --verify-no-changes --verbosity detailed --exclude '**/Migrations/**'
          pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui fmt

      - name: 🔍 Lint
        run: pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui lint

      - name: 🧪 Tests and coverage
        working-directory: apps/api
        run: |
          dotnet test --project tests/Kijk.ArchitectureTests/Kijk.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults
          dotnet test --project tests/Kijk.UnitTests/Kijk.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output unit.coverage.xml \
            --coverage-output-format xml
          dotnet test --project tests/Kijk.IntegrationTests/Kijk.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output integration.coverage.xml \
            --coverage-output-format xml
          pnpm --filter kijk-client test:coverage

      - name: 🔍 .NET audit
        run: dotnet list apps/api/Kijk.slnx package --vulnerable --include-transitive
        continue-on-error: true

      - name: 🔍 JavaScript audit
        run: pnpm audit
        continue-on-error: true

      - name: 🔎 Complete SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
