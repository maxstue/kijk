name: SonarQube Cloud 🔎

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "🔎 Analyze repository"
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # The ci environment binds the shared CI identity in Infisical (OIDC subject), which may only read
    # dev /CI/E2e and prod /CI/Sonar.
    environment: ci
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 🏖️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔧 Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: 🔧 Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: package.json
          node-version: '26'
          cache: true
          run-install: false

      - name: 📦 Install JavaScript dependencies
        run: vp install --frozen-lockfile

      - name: 🎭 Install Playwright browser
        run: pnpm --filter kijk-client exec playwright install --with-deps chromium

      - name: 📦 Restore .NET dependencies
        run: dotnet restore apps/api/Kijk.slnx --locked-mode

      # Runs before the SonarQube analysis starts: `sonarscanner begin` injects the server's rule set, and
      # `dotnet format` would then apply those analyzer fixes and fail the check.
      - name: 🧹 Format
        run: |
          dotnet format apps/api/Kijk.slnx --no-restore --verify-no-changes --verbosity detailed --exclude '**/Migrations/**'
          pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui --filter @kijk/oxlint-plugin-boundaries fmt

      - name: 📦 Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: 🔐 Load SonarQube token
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: https://eu.infisical.com
          env-slug: prod
          secret-path: /CI/Sonar

      # The generated lockfile is not analyzed (package names like "react-password-toggle-field" trigger S2068).
      # S2699 does not recognize Vitest browser assertions (`await expect.element(...)`) in component tests.
      - name: 🔎 Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"maxstue_kijk" \
            /o:"maxstue" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="apps/api/TestResults/*.coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="apps/client/coverage/lcov.info" \
            /d:sonar.plsql.file.suffixes="tab,pkb" \
            /d:sonar.postgres.file.suffixes="sql,pgsql,psql" \
            /d:sonar.exclusions="**/pnpm-lock.yaml" \
            /d:sonar.issue.ignore.multicriteria="browsertests" \
            /d:sonar.issue.ignore.multicriteria.browsertests.ruleKey="typescript:S2699" \
            /d:sonar.issue.ignore.multicriteria.browsertests.resourceKey="**/*.browser.test.tsx"

      - name: 🧱 Build
        run: |
          dotnet build apps/api/Kijk.slnx --configuration Release --no-restore
          pnpm build:client

      - name: 🔍 Lint
        run: pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui --filter @kijk/oxlint-plugin-boundaries lint

      # Frontend tests run in their own step before the .NET tests, so the browser tests do not start while the
      # Testcontainers databases of the integration tests are still shutting down.
      - name: 🧪 Frontend tests and coverage
        run: pnpm --filter kijk-client test:coverage

      - name: 🧪 .NET tests and coverage
        working-directory: apps/api
        run: |
          dotnet test --project tests/Kijk.ArchitectureTests/Kijk.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults
          dotnet test --project tests/Kijk.UnitTests/Kijk.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output unit.coverage.xml \
            --coverage-output-format xml
          dotnet test --project tests/Kijk.IntegrationTests/Kijk.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output integration.coverage.xml \
            --coverage-output-format xml

      - name: 🔍 .NET audit
        run: dotnet list apps/api/Kijk.slnx package --vulnerable --include-transitive
        continue-on-error: true

      - name: 🔍 JavaScript audit
        run: pnpm audit
        continue-on-error: true

      - name: 🔎 Complete SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        run: '"${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
