name: Railway config

# Compares `.railway/railway.ts` with the live Railway environment (`railway config plan`). It never applies anything.
# The plan is written to the job summary with variable values redacted. The steps live in `actions/railway-config`,
# which the deployment workflow uses to apply the file before a release.
#
# It only reports changes for review and fails when the file cannot be evaluated or Railway cannot be reached. The
# production release (`deployment.yml`) makes its own plan and applies it.
#
# The plan evaluates repository code (`railway.ts` and its dependencies) with a Railway project token for production.
# Callers therefore run it only for trusted refs: same-repository pull requests by people and `main`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    name: "🚂 Railway plan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The ci environment binds the shared CI identity in Infisical (OIDC subject), which may only read
    # dev /CI/E2e, prod /CI/Sonar and prod /CI/Railway.
    # deployment: false uses the environment for its variables and OIDC subject without creating a deployment entry.
    environment:
      name: ci
      deployment: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Provides Node and the `railway` SDK that the CLI needs to evaluate `.railway/railway.ts`.
      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js

      # RAILWAY_PLAN_TOKEN: project token of the Railway project `kijk`, environment `production`.
      - name: "🔐 Load Railway token"
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: https://eu.infisical.com
          env-slug: prod
          secret-path: /CI/Railway

      - name: "🔎 Plan"
        uses: ./.github/actions/railway-config
        with:
          project_token: ${{ env.RAILWAY_PLAN_TOKEN }}
          mode: report
