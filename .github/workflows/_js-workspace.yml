name: JavaScript workspace

# Checks one JavaScript app or package. `ci.yml` calls it once per workspace, so every app and package is its own
# block in the checks list and in the graph, with one job per check inside:
#
#   Lint & format
#   Build ─── E2E
#   Test
#
# - `lint`: format and lint.
# - `build`: the `build` script with `build: true`, otherwise the `typecheck` script.
# - `test`: the Vitest suite with coverage, only with `test: true`. The LCOV report is uploaded as
#   `coverage-js-<workspace>`, which `_sonar.yml` picks up automatically.
# - `e2e`: the E2E tests (Playwright by default), only with `e2e: true` and after the build passed. The command,
#   timeout and the Infisical secrets it loads are inputs.
#
# The workspace needs the scripts `fmt`, `lint`, `typecheck` and, if enabled, `build` and `test:coverage`.
# `kijk-api` is not checked here: its scripts wrap the dotnet CLI and are checked by `_dotnet.yml`.
#
# There are no workflow-level permissions on purpose: the `e2e` job inherits the permissions of the calling job, so only
# a caller that runs E2E tests with secrets has to grant `id-token: write`. All other jobs reduce them to read access.

on:
  workflow_call:
    inputs:
      workspace:
        description: Short workspace name, used for the coverage artifact.
        type: string
        required: true
      directory:
        description: Directory of the workspace.
        type: string
        required: true
      build:
        description: Run the `build` script instead of the `typecheck` script.
        type: boolean
        default: false
      test:
        description: Run the `test:coverage` script and upload the coverage.
        type: boolean
        default: false
      browser:
        description: Install Chromium for Vitest browser tests.
        type: boolean
        default: false
      e2e:
        description: Run the E2E tests after the other jobs.
        type: boolean
        default: false
      e2e-command:
        description: Command that runs the E2E tests in the workspace directory.
        type: string
        default: pnpm exec playwright test
      e2e-timeout:
        description: Timeout of the E2E job in minutes.
        type: number
        default: 20
      e2e-secrets-env:
        description: Infisical environment slug to load the E2E secrets from.
        type: string
        default: dev
      e2e-secrets-path:
        description: >-
          Infisical secret path to load for the E2E tests; empty loads no secrets. The calling job has to grant
          `id-token: write` for it.
        type: string
        default: ""

jobs:
  lint:
    name: "🧹 Lint & format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js

      - name: "🧹 Format"
        run: pnpm fmt

      - name: "🔍 Lint"
        run: pnpm lint

  build:
    name: ${{ inputs.build && '🧱 Build' || '🧱 Typecheck' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js

      # The client build runs `tsc` itself, so a separate typecheck would only repeat it.
      - name: "🧪 Typecheck"
        if: "!inputs.build"
        run: pnpm typecheck

      # The build only checks that the client compiles. The Clerk publishable key is validated at runtime and
      # Railway builds the deployed client with its own variables, so no secrets are needed here.
      - name: "🧱 Build"
        if: inputs.build
        run: pnpm build

  test:
    name: "🧪 Test"
    if: inputs.test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js
        with:
          playwright: ${{ inputs.browser }}

      - name: "📊 Tests and coverage"
        run: pnpm test:coverage

      - name: "📎 Upload coverage"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-js-${{ inputs.workspace }}
          path: ${{ inputs.directory }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # Waits only for the build: a broken build would fail the E2E tests anyway, while lint and unit tests run alongside,
  # which saves the duration of the unit tests. As a job of its own, a flaky run can be repeated alone.
  e2e:
    name: "🎭 E2E"
    needs: [build]
    if: inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.e2e-timeout }}
    # The ci environment binds the shared CI identity in Infisical (OIDC subject), which may only read
    # dev /CI/E2e and prod /CI/Sonar.
    # deployment: false uses the environment for its variables and OIDC subject without creating a deployment entry.
    environment:
      name: ci
      deployment: false
    # No permissions here: the job inherits them from the calling job (see the header).

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js
        with:
          playwright: true

      - name: "🔐 Load E2E secrets"
        if: inputs.e2e-secrets-path != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: https://eu.infisical.com
          env-slug: ${{ inputs.e2e-secrets-env }}
          secret-path: ${{ inputs.e2e-secrets-path }}

      - name: "🎭 E2E tests"
        working-directory: ${{ inputs.directory }}
        run: ${{ inputs.e2e-command }}

      - name: "📎 Upload Playwright results"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ inputs.workspace }}
          path: ${{ inputs.directory }}/test-results
          retention-days: 7
