name: Client 💻

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/client.yml'
      - 'apps/client/**'
      - 'package.json'
      - 'packages/config/**'
      - 'packages/core/**'
      - 'packages/oxlint-plugin-boundaries/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: ['main', 'develop']
    paths:
      - '.github/workflows/client.yml'
      - 'apps/client/**'
      - 'package.json'
      - 'packages/config/**'
      - 'packages/core/**'
      - 'packages/oxlint-plugin-boundaries/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  basic:
    name: '🛠️ Build, Lint/Format, Test'
    runs-on: ubuntu-latest

    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🔧 Set up Vite+'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: package.json
          node-version: '26'
          cache: true
          run-install: false

      - name: '📦 Install dependencies'
        run: vp install --frozen-lockfile

      - name: '🌐 Install Playwright browser'
        run: pnpm --filter kijk-client exec playwright install --with-deps chromium

      - name: '🧱 Build'
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: pnpm build:client

      - name: '🧪 Typecheck'
        run: pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui typecheck

      - name: '🧹 Format'
        run: pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui --filter @kijk/oxlint-plugin-boundaries fmt

      - name: '🔍 Lint'
        run: pnpm --filter kijk-client --filter @kijk/config --filter @kijk/core --filter @kijk/ui --filter @kijk/oxlint-plugin-boundaries lint

      - name: '📊 Frontend tests and coverage'
        run: pnpm --filter kijk-client test:coverage

      - name: '🎭 Frontend E2E tests'
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter kijk-client exec playwright test

      - name: '🔍 Audit'
        run: pnpm audit
        continue-on-error: true
