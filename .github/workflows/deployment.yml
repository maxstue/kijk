name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-source:
    name: 'Validate Release Source 🔎'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 'Require main branch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error title=Invalid release source::Production releases must be started from the main branch."
            exit 1
          fi

  prepare-release:
    name: 'Prepare Release 🏷️'
    needs: [validate-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: '🔧 Set up JavaScript'
        uses: ./.github/actions/setup-js

      - name: '🏷️ Determine release metadata'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec release-it --release-version --no-git.changelog)"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release version::release-it returned '$version'."
            exit 1
          fi

          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  migrate-database:
    name: 'Migrate Database 🗃️'
    needs: [prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production environment binds the Infisical identity (OIDC subject) that may only read
    # prod /CI/Deploy and prod /CI/Database.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🔐 Load secrets'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: https://eu.infisical.com
          env-slug: prod
          secret-path: /CI/Database

      - name: '🗃️ Build and apply migrations'
        uses: ./.github/actions/migrate-database
        with:
          connection_string: ${{ env.API_MIGRATION_CONNECTION }}

  deploy:
    name: 'Deploy ${{ matrix.name }} 🚂'
    needs: [migrate-database, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    # The production environment binds the Infisical identity (OIDC subject) that may only read
    # prod /CI/Deploy and prod /CI/Database.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    strategy:
      # A failed deployment must not cancel the other service in the middle of its deployment.
      fail-fast: false
      matrix:
        include:
          - name: API
            service_id_variable: RAILWAY_API_SERVICE_ID
          - name: Client
            service_id_variable: RAILWAY_CLIENT_SERVICE_ID
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🔐 Load secrets'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: https://eu.infisical.com
          env-slug: prod
          secret-path: /CI/Deploy

      - name: '🚀 Deploy ${{ matrix.name }} to Railway'
        uses: ./.github/actions/deploy-railway
        with:
          api_token: ${{ env.RAILWAY_DEPLOY_TOKEN }}
          project_id: ${{ env.RAILWAY_PROJECT_ID }}
          service_id: ${{ env[matrix.service_id_variable] }}
          environment_id: ${{ env.RAILWAY_ENVIRONMENT_ID }}
          release_summary: Deploy ${{ matrix.name }} from ${{ github.sha }}
          release_version: ${{ needs.prepare-release.outputs.version }}
          source_sha: ${{ needs.prepare-release.outputs.source_sha }}

  release:
    name: 'Create Release 📝'
    needs: [deploy, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: '🏖️ Checkout main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: '📝 Create release'
        uses: ./.github/actions/create-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_sha: ${{ needs.prepare-release.outputs.source_sha }}
          version: ${{ needs.prepare-release.outputs.version }}
