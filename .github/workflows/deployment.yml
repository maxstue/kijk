name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-source:
    name: 'Validate Release Source 🔎'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 'Require main branch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error title=Invalid release source::Production releases must be started from the main branch."
            exit 1
          fi

  migrate-database:
    name: 'Migrate Database 🗃️'
    needs: [validate-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-db
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🗃️ Build and apply migrations'
        uses: ./.github/actions/migrate-database
        with:
          connection_string: ${{ secrets.API_MIGRATION_CONNECTION }}
          dotnet_version: '10.x.x'

  deploy-api:
    name: 'Deploy API 🚂'
    needs: [migrate-database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: production
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🚀 Deploy API to Railway'
        uses: ./.github/actions/deploy-railway
        with:
          api_token: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service_id: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          environment_id: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          release_summary: Deploy API from ${{ github.sha }}

  deploy-client:
    name: 'Deploy Client 🚂'
    needs: [migrate-database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: production
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🚀 Deploy Client to Railway'
        uses: ./.github/actions/deploy-railway
        with:
          api_token: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service_id: ${{ secrets.RAILWAY_CLIENT_SERVICE_ID }}
          environment_id: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          release_summary: Deploy client from ${{ github.sha }}

  release:
    name: 'Create Release 📝'
    needs: [deploy-api, deploy-client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: '🏖️ Checkout main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: '📝 Create release'
        uses: ./.github/actions/create-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_sha: ${{ github.sha }}
