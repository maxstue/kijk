name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-source:
    name: 'Validate Release Source 🔎'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 'Require main branch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error title=Invalid release source::Production releases must be started from the main branch."
            exit 1
          fi

  prepare-release:
    name: 'Prepare Release 🏷️'
    needs: [validate-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: '🔧 Set up Vite+'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version-file: package.json
          node-version: '26'
          cache: true
          run-install: false

      - name: '📦 Install dependencies'
        run: vp install --frozen-lockfile

      - name: '🏷️ Determine release metadata'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec release-it --release-version --no-git.changelog)"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release version::release-it returned '$version'."
            exit 1
          fi

          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  migrate-database:
    name: 'Migrate Database 🗃️'
    needs: [prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-db
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🗃️ Build and apply migrations'
        uses: ./.github/actions/migrate-database
        with:
          connection_string: ${{ secrets.API_MIGRATION_CONNECTION }}

  deploy-api:
    name: 'Deploy API 🚂'
    needs: [migrate-database, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: production
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🚀 Deploy API to Railway'
        uses: ./.github/actions/deploy-railway
        with:
          api_token: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service_id: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          environment_id: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          release_summary: Deploy API from ${{ github.sha }}
          release_version: ${{ needs.prepare-release.outputs.version }}
          source_sha: ${{ needs.prepare-release.outputs.source_sha }}

  deploy-client:
    name: 'Deploy Client 🚂'
    needs: [migrate-database, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: production
    steps:
      - name: '🏖️ Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🚀 Deploy Client to Railway'
        uses: ./.github/actions/deploy-railway
        with:
          api_token: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
          project_id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service_id: ${{ secrets.RAILWAY_CLIENT_SERVICE_ID }}
          environment_id: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          release_summary: Deploy client from ${{ github.sha }}
          release_version: ${{ needs.prepare-release.outputs.version }}
          source_sha: ${{ needs.prepare-release.outputs.source_sha }}

  release:
    name: 'Create Release 📝'
    needs: [deploy-api, deploy-client, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: '🏖️ Checkout main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: '📝 Create release'
        uses: ./.github/actions/create-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_sha: ${{ needs.prepare-release.outputs.source_sha }}
          version: ${{ needs.prepare-release.outputs.version }}
