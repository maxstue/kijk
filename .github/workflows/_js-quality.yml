name: JavaScript quality

# Builds the client and checks types, formatting, lint and dependencies of every JavaScript workspace. The recursive
# pnpm commands pick up new workspaces automatically; `kijk-api` is excluded because its scripts wrap the dotnet CLI
# and are checked by `_dotnet.yml`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: "🛠️ Build, typecheck, format and lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up JavaScript"
        uses: ./.github/actions/setup-js

      # The build only checks that the client compiles. The Clerk publishable key is validated at runtime and
      # Railway builds the deployed client with its own variables, so no secrets are needed here.
      - name: "🧱 Build"
        run: pnpm build:client

      - name: "🧪 Typecheck"
        run: pnpm --recursive --filter '!kijk-api' run typecheck

      - name: "🧹 Format"
        run: pnpm --recursive --filter '!kijk-api' run fmt

      - name: "🔍 Lint"
        run: pnpm --recursive --filter '!kijk-api' run lint

      - name: "🔍 Audit"
        run: pnpm audit
        continue-on-error: true
