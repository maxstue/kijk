name: Api 🚀

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/api/**"
      - ".github/actions/setup-dotnet/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "apps/api/**"
      - ".github/actions/setup-dotnet/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./apps/api

jobs:
  basic:
    name: "🛠️ Build, Lint/Format & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🏖️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: 📦 Install dependencies
        run: dotnet restore "Kijk.slnx" --locked-mode

      - name: 🧱 Build
        run: dotnet build "Kijk.slnx" -c Release --no-restore

      - name: 🧹 Format
        run: dotnet format --no-restore --verify-no-changes --verbosity detailed --exclude '**/Migrations/**'

      - name: 🧪 Test
        run: |
          dotnet test --project tests/Kijk.Api.SourceGenerators.Tests/Kijk.Api.SourceGenerators.Tests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults
          dotnet test --project tests/Kijk.ArchitectureTests/Kijk.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults
          dotnet test --project tests/Kijk.UnitTests/Kijk.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output unit.coverage.xml \
            --coverage-output-format xml
          dotnet test --project tests/Kijk.IntegrationTests/Kijk.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output integration.coverage.xml \
            --coverage-output-format xml

      - name: 🔍 Audit
        run: |
          dotnet list package --vulnerable --include-transitive --format=json > list.json
          if jq -cre '.projects | .. | .severity? // empty | select(test("Critical"))' list.json; then
            echo 'Vulnerabilities found! Exiting...'
            jq . list.json
            exit 1
          else
            echo 'No vulnerabilities found!'
          fi
