name: Api 🚀

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["apps/api/**"]
  pull_request:
    branches: ["main", "develop"]
    paths: ["apps/api/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: ./apps/api

jobs:
  basic:
    name: "🛠️ Build, Lint/Format & Test"
    runs-on: ubuntu-latest

    steps:
      - name: 🏖️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/api/global.json

      - name: 📦 Install dependencies
        run: dotnet restore "Kijk.slnx"

      - name: 🧱 Build
        run: dotnet build "Kijk.slnx" -c Release --no-restore

      - name: 🧹 Format
        run: dotnet format --verify-no-changes --verbosity detailed --exclude '**/Migrations/**'

      - name: 🧪 Test
        run: |
          dotnet test --project tests/Kijk.ArchitectureTests/Kijk.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults
          dotnet test --project tests/Kijk.UnitTests/Kijk.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output unit.coverage.xml \
            --coverage-output-format xml
          dotnet test --project tests/Kijk.IntegrationTests/Kijk.IntegrationTests.csproj \
            --configuration Release \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-output integration.coverage.xml \
            --coverage-output-format xml

      - name: 🔍 Audit
        run: |
          dotnet list package --vulnerable --include-transitive --format=json > list.json
          if jq -cre '.projects | .. | .severity? // empty | select(test("Critical"))' list.json; then
            echo 'Vulnerabilities found! Exiting...'
            jq . list.json
            exit 1
          else
            echo 'No vulnerabilities found!'
          fi
        continue-on-error: true
