name: .NET

# Checks one .NET app. `ci.yml` calls it once per app, so every app is its own block in the checks list and in the
# graph, with one job per check inside; the jobs run in parallel:
#
# - `lint`: `dotnet format` (whitespace, code style and analyzers). It needs no build: loading the solution builds the
#   source generators it depends on.
# - `build`: Release build of the solution.
# - `test`: all test projects of the solution with coverage, uploaded as `coverage-dotnet-<workspace>` for `_sonar.yml`.
# - `audit`: fails on vulnerable NuGet packages with high or critical severity.

on:
  workflow_call:
    inputs:
      workspace:
        description: Short app name, used for the coverage artifact.
        type: string
        required: true
      directory:
        description: Directory of the app.
        type: string
        required: true
      solution:
        description: Solution file, relative to the directory.
        type: string
        required: true
      format-exclude:
        description: Glob that `dotnet format` skips, e.g. generated migrations; empty skips nothing.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: "🧹 Lint & format"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up .NET"
        uses: ./.github/actions/setup-dotnet

      - name: "📦 Restore dependencies"
        run: dotnet restore "${{ inputs.solution }}" --locked-mode

      - name: "🧹 Format"
        env:
          FORMAT_EXCLUDE: ${{ inputs.format-exclude }}
        run: |
          exclude=()
          if [ -n "$FORMAT_EXCLUDE" ]; then exclude=(--exclude "$FORMAT_EXCLUDE"); fi
          dotnet format "${{ inputs.solution }}" --no-restore --verify-no-changes --verbosity detailed "${exclude[@]}"

  build:
    name: "🧱 Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up .NET"
        uses: ./.github/actions/setup-dotnet

      - name: "📦 Restore dependencies"
        run: dotnet restore "${{ inputs.solution }}" --locked-mode

      - name: "🧱 Build"
        run: dotnet build "${{ inputs.solution }}" --configuration Release --no-restore

  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up .NET"
        uses: ./.github/actions/setup-dotnet

      - name: "📦 Restore dependencies"
        run: dotnet restore "${{ inputs.solution }}" --locked-mode

      # Microsoft.Testing.Platform writes one `<guid>.xml` coverage report per test project.
      - name: "🧪 Tests and coverage"
        run: |
          dotnet test --solution "${{ inputs.solution }}" \
            --configuration Release \
            --results-directory TestResults \
            --coverage \
            --coverage-output-format xml

      - name: "📎 Upload coverage"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-dotnet-${{ inputs.workspace }}
          path: ${{ inputs.directory }}/TestResults/*.xml
          if-no-files-found: error
          retention-days: 7

  audit:
    name: "🔍 Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: "🏖️ Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "🔧 Set up .NET"
        uses: ./.github/actions/setup-dotnet

      - name: "📦 Restore dependencies"
        run: dotnet restore "${{ inputs.solution }}" --locked-mode

      - name: "🔍 Audit"
        run: |
          dotnet list "${{ inputs.solution }}" package --vulnerable --include-transitive --format=json > list.json
          high_or_critical="$(jq '.projects | [.. | objects | .severity? // empty | select(. == "High" or . == "Critical")] | length' list.json)"
          jq . list.json
          if [ "$high_or_critical" -gt 0 ]; then
            echo 'High or critical vulnerabilities found! Exiting...'
            exit 1
          else
            echo 'No high or critical vulnerabilities found.'
          fi
